services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ats
      POSTGRES_PASSWORD: ats
      POSTGRES_DB: ats_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ats -d ats_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ats-minio
      MINIO_ROOT_PASSWORD: ats-minio-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Development mail catcher: accepts SMTP on 1025 and shows every message in a
  # web inbox on http://localhost:8025. Nothing leaves the machine. Point
  # SMTP_HOST=mailpit to exercise the real send path without a provider.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - model_cache:/app/.model_cache
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: ./backend
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - model_cache:/app/.model_cache
    command: dramatiq app.workers.tasks

  frontend:
    build:
      context: ./Frontend
      # The default target is the production runtime, which serves a prebuilt
      # bundle. Development needs the dev server and hot reload.
      target: dev
    ports:
      # Override with FRONTEND_PORT if something already holds 3000 — most often
      # a `npm run dev` started outside Docker for the same project.
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    depends_on:
      - backend
    volumes:
      - ./Frontend:/app
      # node_modules and .next get their own volumes so the container keeps a
      # separate copy from the host. Without the .next volume, a host-side
      # `next dev` or `next build` and the container write to the same build
      # cache through the bind mount and corrupt each other's output — the
      # symptom is "Cannot find module './vendor-chunks/...'" or a missing
      # _document.js on every route.
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next

volumes:
  postgres_data:
  minio_data:
  frontend_node_modules:
  frontend_next_cache:
  model_cache:
