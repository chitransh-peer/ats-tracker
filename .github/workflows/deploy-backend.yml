name: Deploy ATS Backend to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

env:
  PROJECT_ID: "peer-website-504716"
  REGION: "us-central1"
  GAR_LOCATION: "us-central1"
  REPOSITORY: "ats-artifacts"
  SERVICE_NAME: "ats-backend"
  # The public site is served from the custom domain; the run.app URL still
  # resolves and is kept as a second allowed origin so a direct hit on it, or a
  # rollback to before the domain mapping, does not break the browser client.
  APP_URL: "https://ats.peer-consulting.com"
  FRONTEND_URL: "https://ats-frontend-665490213826.us-central1.run.app"
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # These are injected into the Cloud Run service below. An unset secret
      # would otherwise deploy an empty value — a blank JWT signing key, or a
      # Super Admin seeded with an empty password that nobody can log in with.
      # Failing here is far cheaper than debugging that in the running service.
      - name: Verify required secrets are configured
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SUPER_ADMIN_EMAIL: ${{ secrets.SUPER_ADMIN_EMAIL }}
          SUPER_ADMIN_PASSWORD: ${{ secrets.SUPER_ADMIN_PASSWORD }}
        run: |
          missing=""
          for name in DB_PASSWORD JWT_SECRET SUPER_ADMIN_EMAIL SUPER_ADMIN_PASSWORD; do
            eval "value=\$$name"
            [ -n "$value" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi
          echo "All required secrets are present."

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authenticate Docker to Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }} backend
          docker push ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}

      # Composed in a shell step rather than inline on the deploy flags so that
      # optional settings can be *omitted* when they have no value. Sending an
      # empty string would not be a no-op: --update-env-vars would overwrite
      # whatever the service already has, wiping configuration that was applied
      # outside this workflow. Anything left unset here keeps its current value
      # on the service.
      - name: Compose environment variables
        id: envvars
        env:
          APP_URL: ${{ env.APP_URL }}
          FRONTEND_URL: ${{ env.FRONTEND_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SUPER_ADMIN_EMAIL: ${{ secrets.SUPER_ADMIN_EMAIL }}
          SUPER_ADMIN_PASSWORD: ${{ secrets.SUPER_ADMIN_PASSWORD }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          FORCE_RESET: ${{ vars.FORCE_SUPER_ADMIN_PASSWORD_RESET || 'false' }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USE_TLS: ${{ vars.SMTP_USE_TLS }}
          MAIL_FROM_EMAIL: ${{ vars.MAIL_FROM_EMAIL }}
          MAIL_FROM_NAME: ${{ vars.MAIL_FROM_NAME }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          EMBEDDINGS_ENABLED: ${{ vars.EMBEDDINGS_ENABLED }}
          STORAGE_ENDPOINT_URL: ${{ vars.STORAGE_ENDPOINT_URL }}
          STORAGE_BUCKET: ${{ vars.STORAGE_BUCKET }}
          STORAGE_REGION: ${{ vars.STORAGE_REGION }}
          STORAGE_ACCESS_KEY: ${{ secrets.STORAGE_ACCESS_KEY }}
          STORAGE_SECRET_KEY: ${{ secrets.STORAGE_SECRET_KEY }}
          REDIS_URL: ${{ vars.REDIS_URL }}
        run: |
          pairs=""
          add() {
            # $1 = variable name on the service, $2 = value. Skips empty values.
            [ -n "$2" ] || return 0
            if [ -n "$pairs" ]; then pairs="$pairs##"; fi
            pairs="$pairs$1=$2"
          }

          add APP_ENV production
          add CORS_ORIGINS "$APP_URL,$FRONTEND_URL"
          add APP_BASE_URL "$APP_URL"
          add JWT_SECRET "$JWT_SECRET"
          add SECRET_KEY "$JWT_SECRET"
          add DEFAULT_SUPER_ADMIN_EMAIL "$SUPER_ADMIN_EMAIL"
          add DEFAULT_SUPER_ADMIN_PASSWORD "$SUPER_ADMIN_PASSWORD"
          add FORCE_SUPER_ADMIN_PASSWORD_RESET "$FORCE_RESET"
          add DATABASE_URL "postgresql+psycopg://ats:$DB_PASSWORD@/ats_tracker?host=/cloudsql/peer-website-504716:us-central1:ats-db-instance"

          # Optional. Each is skipped entirely when unset, leaving whatever the
          # service already has untouched.
          add SMTP_HOST "$SMTP_HOST"
          add SMTP_PORT "$SMTP_PORT"
          add SMTP_USERNAME "$SMTP_USERNAME"
          add SMTP_PASSWORD "$SMTP_PASSWORD"
          add SMTP_USE_TLS "$SMTP_USE_TLS"
          add MAIL_FROM_EMAIL "$MAIL_FROM_EMAIL"
          add MAIL_FROM_NAME "$MAIL_FROM_NAME"
          add AI_PROVIDER "$AI_PROVIDER"
          add OPENROUTER_API_KEY "$OPENROUTER_API_KEY"
          add OPENROUTER_MODEL "$OPENROUTER_MODEL"
          add EMBEDDINGS_ENABLED "$EMBEDDINGS_ENABLED"
          add STORAGE_ENDPOINT_URL "$STORAGE_ENDPOINT_URL"
          add STORAGE_BUCKET "$STORAGE_BUCKET"
          add STORAGE_REGION "$STORAGE_REGION"
          add STORAGE_ACCESS_KEY "$STORAGE_ACCESS_KEY"
          add STORAGE_SECRET_KEY "$STORAGE_SECRET_KEY"
          add REDIS_URL "$REDIS_URL"

          # The value carries secrets, so only the names are printed. GitHub
          # masks registered secrets in logs, but not printing them is surer.
          echo "Setting: $(echo "$pairs" | sed 's/##/\n/g' | cut -d= -f1 | tr '\n' ' ')"
          echo "pairs=$pairs" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          flags: |
            --allow-unauthenticated
            --port=8000
            --timeout=300
            --cpu=1
            --memory=1Gi
            --add-cloudsql-instances=peer-website-504716:us-central1:ats-db-instance
            --update-env-vars=^##^${{ steps.envvars.outputs.pairs }}

      - name: Show Output URL
        run: echo "Backend deployed to ${{ steps.deploy.outputs.url }}"