name: CI

on:
  pull_request:

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - run: npm ci

      # Split from `npm run verify` so a failure names the step that broke.
      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ats
          POSTGRES_PASSWORD: ats
          POSTGRES_DB: ats_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ats -d ats_tracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      # S3-compatible object storage for the tests that upload candidate
      # documents. This used to be the minio/minio image, which Docker Hub no
      # longer serves ("pull access denied"). moto's server speaks the same S3
      # API, installs from PyPI, and the app creates the bucket itself on first
      # use (app/services/storage/service.py), so nothing else changes.
      - name: Start S3 test server
        run: |
          pip install "moto[server]>=5,<6"
          nohup moto_server -H 127.0.0.1 -p 9000 > moto.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fs http://localhost:9000/ > /dev/null; then
              echo "S3 test server is up"; exit 0
            fi
            sleep 1
          done
          echo "S3 test server failed to start"; cat moto.log; exit 1

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Tests
        run: pytest -q
        env:
          # Services are published on localhost to the runner, not a compose network.
          DATABASE_URL: postgresql+psycopg://ats:ats@localhost:5432/ats_tracker
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ci-secret-not-used-outside-continuous-integration
          STORAGE_ENDPOINT_URL: http://localhost:9000
          STORAGE_BUCKET: ats-tracker
          STORAGE_ACCESS_KEY: ats-minio
          STORAGE_SECRET_KEY: ats-minio-secret
          EMBEDDINGS_ENABLED: "false"
          # Assert the shipped defaults: mail disabled, reset token never exposed.
          SMTP_HOST: ""
          EXPOSE_PASSWORD_RESET_TOKEN: "false"
